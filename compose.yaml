services:
  counter-strike:
    container_name: counter-strike

    # Keeps the HLDS console attached
    stdin_open: true
    tty: true

    # Fixes the 10 second delay when stopping and SIGKILL
    init: true

    # Pasta results in minimal latency whilst still allowing for port mapping
    network_mode: "pasta"
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"

    volumes:
      # Volume where all the files and configs live
      - ./cstrike:/opt/hlds/cstrike:U,Z
      # Accurate tz in logs
      - /etc/localtime:/etc/localtime:ro

    # Config overrides, applied on every start
    environment:
      # Components. All 0 = plain ReHLDS
      ENABLE_REGAMEDLL: "1"
      ENABLE_METAMOD: "1"
      ENABLE_AMXMODX: "1"   # needs metamod, includes ReAPI
      # Replays: records cstrike/demos/hltv-<date>-<map>.dem, with voice.
      # HLTV takes a player slot, so raise +maxplayers by one
      ENABLE_HLTV: "0"
      # HLTV_RECORD: "demos/hltv"
      # ENABLE_HLTV_VOICE: "1"
      # A .mka with a track per player next to each finished demo (on with HLTV).
      # "--order team" puts T first, then CT (presets/competitive.yaml does)
      # ENABLE_VOICE_MKA: "1"
      # VOICE_MKA_ARGS: ""

      CVAR_HOSTNAME: "Counter-Strike 1.6 Server"
      CVAR_SV_PASSWORD: ""
      # Silence the AMXX ads/notifications
      AMXX_PLUGIN_SCROLLMSG: "0"
      AMXX_PLUGIN_IMESSAGE: "0"
      CVAR_AMX_HELP_DISPLAY_MSG: "0"
      CVAR_AMX_LANGUAGE_DISPLAY_MSG: "0"

    # Automatically restart on reboot
    restart: always

    # Build and run
    build:
      context: .
    command: >
      ./hlds_run
      -game cstrike
      +ip 0.0.0.0
      +map de_dust2
      +maxplayers 32
      +sv_lan 0
      +exec server.cfg
