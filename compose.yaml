services:
  counter-strike:
    container_name: counter-strike

    # Keeps the HLDS console attached
    stdin_open: true
    tty: true

    # Fixes the 10 second delay when stopping and SIGKILL
    init: true
    # Time to finish the demo being recorded before podman kills everything
    stop_grace_period: 30s

    # Pasta results in minimal latency whilst still allowing for port mapping
    network_mode: "pasta"
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"

    volumes:
      # Volume where all the files and configs live
      - ./cstrike:/opt/hlds/cstrike:U,Z
      # Accurate tz in logs
      - /etc/localtime:/etc/localtime:ro

    # Settings, applied on every start: presets/defaults.env, then the env files and
    # `environment:` in compose.override.yaml. Keep `environment:` out of this file, it
    # would win over the presets
    env_file:
      - presets/defaults.env

    # Automatically restart on reboot
    restart: always

    # Build. The command is the image's (Dockerfile CMD), with +maxplayers and +map from
    # MAXPLAYERS and MAP. Everything else is a cvar
    build:
      context: .
